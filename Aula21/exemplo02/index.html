<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Exemplo 01 - Flex e Flex-direction</title>
</head>
<body>

    <h2>Propriedade do container - flex e flex-direction</h2>

    <div class="container row">
    <div class="box box01">Box 01</div>
    <div class="box box02">Box 02</div>
    <div class="box box03">Box 03</div>
    </div>

    <div class="container row-reverse">
    <div class="box box01">Box 01</div>
    <div class="box box02">Box 02</div>
    <div class="box box03">Box 03</div>
    </div>

    <div class="container column">
    <div class="box box01">Box 01</div>
    <div class="box box02">Box 02</div>
    <div class="box box03">Box 03</div>
    </div>

    <div class="container column-reverse">
    <div class="box box01">Box 01</div>
    <div class="box box02">Box 02</div>
    <div class="box box03">Box 03</div>
    </div>

</body>
</html>
